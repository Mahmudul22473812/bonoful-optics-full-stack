services:
  - type: web
    name: bonoful-optics-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/v1/products?limit=1
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: DATA_KEY
        sync: false
      - key: FILE_ROOT
        value: ./storage
